name: CI/CD Pipeline for CSC325 Django Project

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Setup: downloads the code and installs Python.
      - name: Setup - Check out code
        uses: actions/checkout@v4

      - name: Setup - Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Dependencies: installs the packages listed in requirements.txt.
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Test: runs all the tests, and a failure stops the pipeline.
      - name: Test
        run: |
          python manage.py test

      # Deploy: builds the site and publishes it to GitHub Pages.
      - name: Deploy - Build site
        run: |
          python build_site.py

      - name: Deploy - Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
